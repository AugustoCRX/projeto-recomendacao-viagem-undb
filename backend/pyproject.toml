[project]
requires-python = ">=3.9"
name = "backend"
version = "0.2.0"
description = "Smart Travel Planner API"
authors = [
    { name = "Augusto Cesar", email = "augusto.cesar.rodrigues@gmail.com" },
]
dependencies = [
    "fastapi>=0.103.0",
    "uvicorn==0.23.2",
    "pydantic[email]>=2.0.0",
    "requests>=2.32.0",
    "loguru>=0.7.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0",
    "alembic>=1.13.0",
    "markdown>=3.5.0",
    "langgraph>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "langchain-core>=0.1.0",
    "langchain-groq>=0.2.0",
    "langchain-openai>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2",
    "pytest-cov>=4.1",
    "anyio>=4.0",
    "black>=24.3",
    "autopep8>=2.0.0",
    "ipdb>=0.13.0",
    "pylint>=3.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
# Resolved relative to this pyproject.toml (the backend root, /app inside the
# container). Lets ``pytest`` be invoked from any cwd and still discover suites.
testpaths = ["tests"]
pythonpath = ["app"]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
  \.toml
  |\.sh
  |\.git
  |\.ini
  |Dockerfile
  |Jenkinfile
)/
'''

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]